name: billx
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdf: ^3.13.1
  printing: ^5.15.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  http: ^1.5.0
  mobile_scanner: ^7.4.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.4
  path: ^1.9.1
  connectivity_plus: ^7.3.1
  sqflite_common_ffi: ^2.4.3
  whatsapp_share_plus: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0D47A1"
    theme_color: "#1565C0"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256